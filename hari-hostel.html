<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hari College Hostel Management</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<style>
.d-none{display:none!important}
:root{--blue:#1456c8;--deep:#0b2f6b;--soft:#eef4ff;--ink:#17233d;--line:#dce6f7}
body{font-family:'Segoe UI',system-ui,sans-serif;color:var(--ink);background:var(--soft)}
.btn-primary{--bs-btn-bg:var(--blue);--bs-btn-border-color:var(--blue);--bs-btn-hover-bg:var(--deep);--bs-btn-hover-border-color:var(--deep)}
.btn-outline-primary{--bs-btn-color:var(--blue);--bs-btn-border-color:var(--blue);--bs-btn-hover-bg:var(--blue);--bs-btn-active-bg:var(--blue)}
.text-bg-primary{background:var(--blue)!important}

/* Home / login */
.home{display:grid;grid-template-columns:1.15fr 1fr;min-height:100vh}
.home-photo{background-size:cover;background-position:center top}
.photo-shade{height:100%;min-height:100vh;padding:2.5rem;display:flex;flex-direction:column;justify-content:space-between;color:#fff;
 background:linear-gradient(180deg,rgba(11,47,107,.55) 0%,rgba(11,47,107,.05) 35%,rgba(11,47,107,.9) 100%)}
.brand{font-size:1.25rem;font-weight:600}
.photo-shade h1{font-size:clamp(2rem,4vw,3.4rem);font-weight:700;line-height:1.1}
.photo-shade p{max-width:30ch;font-size:1.1rem;opacity:.9;margin:0}
.home-login{display:flex;align-items:center;justify-content:center;padding:2rem;background:#fff}
.login-card{width:100%;max-width:400px}
.login-card h2{font-weight:700;color:var(--deep)}
@media(max-width:850px){.home{grid-template-columns:1fr}.home-photo{height:55vh}.photo-shade{min-height:0}}

/* Layout */
.side{position:fixed;inset:0 auto 0 0;width:250px;background:var(--deep);color:#cfe0ff;display:flex;flex-direction:column;z-index:1030;transition:transform .25s}
.side-brand{padding:1.4rem 1.2rem;color:#fff;font-size:1.2rem;font-weight:700;border-bottom:1px solid rgba(255,255,255,.12)}
.side-brand small{display:block;font-size:.75rem;font-weight:400;opacity:.7}
#nav{flex:1;padding:.8rem}
#nav a{display:flex;gap:.7rem;align-items:center;padding:.7rem .9rem;border-radius:10px;color:inherit;text-decoration:none;margin-bottom:.2rem;cursor:pointer;transition:background .2s,padding-left .2s}
#nav a:hover{background:rgba(255,255,255,.1);padding-left:1.2rem}
#nav a.active{background:var(--blue);color:#fff}
.side-logout{margin:1rem;background:none;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:10px;padding:.6rem}
.side-logout:hover{background:rgba(255,255,255,.12)}
.content{margin-left:250px}
.topbar{position:sticky;top:0;z-index:1020;background:#fff;border-bottom:1px solid var(--line);padding:.8rem 1.5rem;display:flex;align-items:center;gap:1rem}
@media(max-width:991px){.side{transform:translateX(-100%)}.side.open{transform:none}.content{margin-left:0}.topbar{padding:.8rem 1rem}}

/* Cards and panels */
.stat{background:#fff;border-radius:16px;padding:1.2rem;display:flex;gap:1rem;align-items:center;border:1px solid var(--line);transition:transform .2s,box-shadow .2s}
.stat:hover{transform:translateY(-4px);box-shadow:0 10px 24px rgba(20,86,200,.15)}
.stat .ico{width:54px;height:54px;border-radius:14px;display:grid;place-items:center;font-size:1.6rem;color:#fff}
.stat h3{margin:0;font-weight:700}
.stat span{color:#5d6b88;font-size:.9rem}
.panel{background:#fff;border-radius:16px;border:1px solid var(--line);padding:1.2rem}
.table>:not(caption)>*>*{padding:.8rem}
.table thead{background:var(--soft)}
.room{background:#fff;border-radius:16px;padding:1.1rem;border:1px solid var(--line);border-top:6px solid;transition:transform .2s,box-shadow .2s}
.room:hover{transform:translateY(-4px);box-shadow:0 10px 24px rgba(0,0,0,.1)}
.room.available{border-top-color:#198754}.room.occupied{border-top-color:#dc3545}.room.maintenance{border-top-color:#ffc107}
.avatar{width:84px;height:84px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:2rem;font-weight:700}
.progress{height:12px}

</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const K='hari_hms',$=s=>document.querySelector(s),inr=n=>'₹'+(+n).toLocaleString('en-IN');
const h=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function seed(){
 const n=[['Arjun Reddy','B.Tech CSE'],['Sneha Rao','B.Tech ECE'],['Karthik Naidu','MBA'],['Priya Sharma','B.Sc Physics'],['Rahul Verma','B.Tech Mech'],['Divya Menon','BBA'],['Suresh Kumar','B.Com'],['Anjali Devi','B.Tech IT']];
 const paid=[45000,20000,0,45000,10000,45000,0,30000];
 const students=n.map((x,i)=>({id:'S'+(101+i),name:x[0],course:x[1],phone:'98765432'+(10+i),email:x[0].split(' ')[0].toLowerCase()+'@hari.edu',total:45000,paid:paid[i]}));
 const caps=[2,2,3,3,4,2,2,3];
 const rooms=['101','102','103','104','105','106','201','202'].map((no,i)=>({no,cap:caps[i],occ:[],maint:no=='202'}));
 const al={101:['S101','S102'],102:['S103'],103:['S104'],104:['S105','S106'],106:['S107','S108']};
 rooms.forEach(r=>r.occ=al[r.no]||[]);
 const complaints=[
  {id:1,sid:'S101',title:'Fan not working',desc:'Ceiling fan in room 101 makes noise and stops.',status:'Pending',date:'2026-10-28'},
  {id:2,sid:'S104',title:'Water leakage',desc:'Bathroom tap is leaking.',status:'Resolved',date:'2026-10-20'},
  {id:3,sid:'S106',title:'Wi-Fi is slow',desc:'No internet in the evening.',status:'Pending',date:'2026-11-01'}];
 return{students,rooms,complaints};
}
let db=JSON.parse(localStorage.getItem(K)||'null')||seed();
const save=()=>localStorage.setItem(K,JSON.stringify(db));
let S=JSON.parse(sessionStorage.getItem('s')||'null');

/* ---------- Login ---------- */
{
 let role='admin';
 document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{
  role=b.dataset.role;
  document.querySelectorAll('[data-role]').forEach(x=>x.classList.toggle('active',x==b));
  $('#hint').textContent=role=='admin'?'Demo: admin / admin123':'Demo: S101 / 1234 (any student ID with password 1234)';
  $('#lbl').textContent=role=='admin'?'Username':'Student ID';
  $('#err').classList.add('d-none');
 });
 $('#lf').onsubmit=e=>{
  e.preventDefault();
  const u=$('#u').value.trim(),p=$('#p').value;
  const st=db.students.find(s=>s.id.toLowerCase()==u.toLowerCase());
  const ok=role=='admin'?(u.toLowerCase()=='admin'&&p.trim()=='admin123'):(st&&p.trim()=='1234');
  if(!ok)return $('#err').classList.remove('d-none');
  S={role,id:role=='admin'?'admin':st.id};sessionStorage.setItem('s',JSON.stringify(S));startApp();
 };
}

/* ---------- App ---------- */
let admin=false,menu=[];
const me=()=>db.students.find(x=>x.id==S.id);
const roomOf=id=>db.rooms.find(r=>r.occ.includes(id));
const rs=r=>r.maint?'Maintenance':r.occ.length>=r.cap?'Occupied':'Available';
const rcol={Available:'success',Occupied:'danger',Maintenance:'warning'};
const feeSt=s=>s.paid>=s.total?['Paid','success']:s.paid>0?['Partial','warning']:['Pending','danger'];
const att=s=>({present:20+(+s.id.slice(1))%9,total:30});
const sname=id=>(db.students.find(s=>s.id==id)||{name:'(removed)'}).name;
const logout=()=>{sessionStorage.removeItem('s');S=null;$('#appView').classList.add('d-none');$('#loginView').classList.remove('d-none');$('#lf').reset();};
const toast=m=>{const d=document.createElement('div');d.className='toast align-items-center text-bg-primary border-0';d.innerHTML=`<div class="d-flex"><div class="toast-body">${m}</div><button class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div>`;$('#tc').append(d);new bootstrap.Toast(d,{delay:2500}).show()};
const fld=(l,n,v='',t='text',x='')=>`<div class="mb-3"><label class="form-label">${l}</label><input class="form-control" type="${t}" name="${n}" value="${h(v)}" ${x} required></div>`;
const statCard=(i,l,v,c)=>`<div class="col-sm-6 col-xl-4"><div class="stat"><div class="ico bg-${c}"><i class="bi bi-${i}"></i></div><div><h3>${v}</h3><span>${l}</span></div></div></div>`;
let mcb;
const modal=()=>bootstrap.Modal.getOrCreateInstance($('#m'));
function form(t,html,cb){$('#mt').textContent=t;$('#mb').innerHTML=html;mcb=cb;modal().show()}

const mk=()=>admin
 ?[['dash','speedometer2','Dashboard'],['stu','people','Students'],['room','door-open','Rooms'],['alloc','key','Room Allocation'],['fee','cash-coin','Fees'],['comp','chat-left-text','Complaints']]
 :[['dash','person-badge','My Profile'],['room','door-open','My Room'],['fee','cash-coin','Hostel Fees'],['att','calendar-check','Attendance'],['comp','chat-left-text','Complaints']];

function go(p){
 $('#nav').querySelectorAll('a').forEach(a=>a.classList.toggle('active',a.dataset.p==p));
 $('#title').textContent=menu.find(m=>m[0]==p)[2];
 $('#side').classList.remove('open');
 V[p]();
}

const V={
 dash(){
  if(!admin){
   const s=me(),r=roomOf(s.id),f=feeSt(s);
   $('#view').innerHTML=`<div class="row g-3"><div class="col-lg-5"><div class="panel text-center">
    <div class="avatar mx-auto mb-3">${h(s.name[0])}</div><h4>${h(s.name)}</h4><p class="text-muted mb-3">${h(s.id)} · ${h(s.course)}</p>
    <p class="mb-1"><i class="bi bi-telephone"></i> ${h(s.phone)}</p><p><i class="bi bi-envelope"></i> ${h(s.email)}</p></div></div>
    <div class="col-lg-7"><div class="row g-3">
     ${statCard('door-open','Room',r?r.no:'Not allocated','primary')}
     ${statCard('cash-coin','Fee status',f[0],f[1])}
     ${statCard('calendar-check','Attendance',Math.round(att(s).present/30*100)+'%','info')}
    </div></div></div>`;return;
  }
  const av=db.rooms.filter(r=>rs(r)=='Available').length,oc=db.rooms.filter(r=>rs(r)=='Occupied').length;
  const pend=db.students.reduce((a,s)=>a+s.total-s.paid,0),cp=db.complaints.filter(c=>c.status=='Pending').length;
  $('#view').innerHTML=`<div class="row g-3">
   ${statCard('people-fill','Total Students',db.students.length,'primary')}
   ${statCard('building','Total Rooms',db.rooms.length,'info')}
   ${statCard('door-open','Available Rooms',av,'success')}
   ${statCard('door-closed','Occupied Rooms',oc,'danger')}
   ${statCard('cash-stack','Pending Fees',inr(pend),'warning')}
   ${statCard('chat-left-text','Total Complaints',db.complaints.length+' ('+cp+' pending)','secondary')}</div>`;
 },

 /* Students */
 stu(){
  $('#view').innerHTML=`<div class="d-flex flex-wrap gap-2 justify-content-between mb-3">
   <input id="q" class="form-control w-auto" placeholder="Search by name or ID" oninput="stuRows()">
   <button class="btn btn-primary" onclick="stuForm()"><i class="bi bi-plus-lg"></i> Add student</button></div>
   <div class="panel table-responsive"><table class="table table-hover align-middle mb-0"><thead><tr><th>ID</th><th>Name</th><th>Course</th><th>Phone</th><th>Room</th><th class="text-end">Actions</th></tr></thead><tbody id="tb"></tbody></table></div>`;
  stuRows();
 },
 room(){
  if(!admin){
   const r=roomOf(S.id);
   $('#view').innerHTML=r?`<div class="room ${rs(r).toLowerCase()}" style="max-width:420px"><h3>Room ${r.no}</h3>
    <p class="mb-1">Capacity: ${r.cap} · Occupied: ${r.occ.length}</p><p class="text-muted">Roommates</p>
    <ul class="mb-0">${r.occ.map(i=>`<li>${h(sname(i))} (${i})</li>`).join('')}</ul></div>`
    :`<div class="alert alert-info">No room allocated yet. Contact the hostel office.</div>`;return;
  }
  $('#view').innerHTML=`<div class="d-flex flex-wrap gap-2 justify-content-between mb-3">
   <select id="rf" class="form-select w-auto" onchange="roomCards()"><option value="">All rooms</option><option>Available</option><option>Occupied</option><option>Maintenance</option></select>
   <button class="btn btn-primary" onclick="roomForm()"><i class="bi bi-plus-lg"></i> Add room</button></div><div class="row g-3" id="rc"></div>`;
  roomCards();
 },
 alloc(){
  const free=db.students.filter(s=>!roomOf(s.id)),av=db.rooms.filter(r=>rs(r)=='Available');
  $('#view').innerHTML=`<div class="panel mb-3"><h5>Allocate a room</h5>
   <form id="af" class="row g-2"><div class="col-md-5"><select name="s" class="form-select" required><option value="">Select student without a room</option>${free.map(s=>`<option value="${s.id}">${h(s.name)} (${s.id})</option>`).join('')}</select></div>
   <div class="col-md-5"><select name="r" class="form-select" required><option value="">Select available room</option>${av.map(r=>`<option value="${r.no}">Room ${r.no} · ${r.cap-r.occ.length} bed(s) free</option>`).join('')}</select></div>
   <div class="col-md-2"><button class="btn btn-primary w-100">Allocate</button></div></form></div>
   <div class="panel table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Student</th><th>Course</th><th>Room</th><th>Room status</th><th></th></tr></thead><tbody>
   ${db.students.filter(s=>roomOf(s.id)).map(s=>{const r=roomOf(s.id);return`<tr><td>${h(s.name)} <small class="text-muted">${s.id}</small></td><td>${h(s.course)}</td><td>${r.no}</td><td><span class="badge text-bg-${rcol[rs(r)]}">${rs(r)}</span></td><td class="text-end"><button class="btn btn-sm btn-outline-danger" onclick="vacate('${s.id}')">Vacate</button></td></tr>`}).join('')||'<tr><td colspan="5" class="text-center text-muted">No allocations yet.</td></tr>'}
   </tbody></table></div>`;
  $('#af').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));db.rooms.find(r=>r.no==d.r).occ.push(d.s);save();toast('Room allocated');V.alloc()};
 },
 fee(){
  const list=admin?db.students:[me()];
  $('#view').innerHTML=`<div class="panel table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Student</th><th>Total</th><th>Paid</th><th>Pending</th><th>Status</th><th style="min-width:130px">Progress</th>${admin?'<th class="text-end">Update</th>':''}</tr></thead><tbody>
   ${list.map(s=>{const f=feeSt(s),pc=Math.round(s.paid/s.total*100);return`<tr><td>${h(s.name)} <small class="text-muted">${s.id}</small></td><td>${inr(s.total)}</td><td>${inr(s.paid)}</td><td>${inr(s.total-s.paid)}</td>
   <td><span class="badge text-bg-${f[1]}">${f[0]}</span></td><td><div class="progress"><div class="progress-bar bg-${f[1]}" style="width:${pc}%"></div></div></td>
   ${admin?`<td class="text-end text-nowrap"><button class="btn btn-sm btn-outline-primary" onclick="payForm('${s.id}')">Add payment</button> <button class="btn btn-sm btn-success" onclick="markPaid('${s.id}')">Mark paid</button></td>`:''}</tr>`}).join('')}
   </tbody></table></div>`;
 },
 att(){
  const a=att(me()),pc=Math.round(a.present/a.total*100);
  $('#view').innerHTML=`<div class="panel" style="max-width:560px"><h5>Last 30 days</h5>
   <div class="progress mb-3" style="height:22px"><div class="progress-bar ${pc>=75?'bg-success':'bg-danger'}" style="width:${pc}%">${pc}%</div></div>
   <p class="mb-1">Present: <b>${a.present}</b> days · Absent: <b>${a.total-a.present}</b> days</p>
   <p class="text-muted mb-0">${pc>=75?'Your attendance is above the 75% requirement.':'Your attendance is below the 75% requirement.'}</p></div>`;
 },
 comp(){
  const list=admin?db.complaints:db.complaints.filter(c=>c.sid==S.id);
  $('#view').innerHTML=`${admin?'':`<div class="panel mb-3"><h5>Submit a complaint</h5><form id="cf">${fld('Title','t')}<div class="mb-3"><label class="form-label">Details</label><textarea name="d" class="form-control" rows="3" required></textarea></div><button class="btn btn-primary">Submit complaint</button></form></div>`}
   <div class="d-flex justify-content-between mb-3"><h5 class="mb-0">${admin?'All complaints':'My complaints'}</h5>
   <select id="cs" class="form-select w-auto" onchange="compRows()"><option value="">All</option><option>Pending</option><option>Resolved</option></select></div>
   <div class="panel table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Date</th><th>Student</th><th>Complaint</th><th>Status</th>${admin?'<th></th>':''}</tr></thead><tbody id="cb"></tbody></table></div>`;
  compRows();
  if(!admin)$('#cf').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));
   db.complaints.unshift({id:Date.now(),sid:S.id,title:d.t,desc:d.d,status:'Pending',date:new Date().toISOString().slice(0,10)});save();toast('Complaint submitted');V.comp()};
 }
};

/* Table and card renderers */
function stuRows(){
 const q=($('#q').value||'').toLowerCase();
 const l=db.students.filter(s=>s.name.toLowerCase().includes(q)||s.id.toLowerCase().includes(q));
 $('#tb').innerHTML=l.map(s=>{const r=roomOf(s.id);return`<tr><td>${s.id}</td><td>${h(s.name)}</td><td>${h(s.course)}</td><td>${h(s.phone)}</td><td>${r?r.no:'<span class="text-muted">None</span>'}</td>
  <td class="text-end text-nowrap"><button class="btn btn-sm btn-outline-secondary" onclick="viewStu('${s.id}')"><i class="bi bi-eye"></i></button>
  <button class="btn btn-sm btn-outline-primary" onclick="stuForm('${s.id}')"><i class="bi bi-pencil"></i></button>
  <button class="btn btn-sm btn-outline-danger" onclick="delStu('${s.id}')"><i class="bi bi-trash"></i></button></td></tr>`}).join('')||'<tr><td colspan="6" class="text-center text-muted py-4">No students match your search.</td></tr>';
}
function stuForm(id){
 const s=id?db.students.find(x=>x.id==id):{name:'',course:'',phone:'',email:'',total:45000};
 form(id?'Edit student':'Add student',fld('Full name','name',s.name)+fld('Course','course',s.course)+fld('Phone','phone',s.phone,'tel')+fld('Email','email',s.email,'email')+fld('Hostel fee (₹)','total',s.total,'number','min="0"'),d=>{
  d.total=+d.total;
  if(id)Object.assign(s,d);else db.students.push({id:'S'+(Math.max(100,...db.students.map(x=>+x.id.slice(1)))+1),paid:0,...d});
  save();toast(id?'Student updated':'Student added');stuRows();
 });
}
function viewStu(id){
 const s=db.students.find(x=>x.id==id),r=roomOf(id),f=feeSt(s);
 $('#mt').textContent='Student details';
 $('#mb').innerHTML=`<p><b>${h(s.name)}</b> (${s.id})</p><p class="mb-1">Course: ${h(s.course)}</p><p class="mb-1">Phone: ${h(s.phone)}</p><p class="mb-1">Email: ${h(s.email)}</p><p class="mb-1">Room: ${r?r.no:'Not allocated'}</p><p class="mb-0">Fees: ${inr(s.paid)} of ${inr(s.total)} <span class="badge text-bg-${f[1]}">${f[0]}</span></p>`;
 mcb=()=>{};modal().show();
}
function delStu(id){
 if(!confirm('Delete this student and their complaints?'))return;
 db.students=db.students.filter(s=>s.id!=id);db.rooms.forEach(r=>r.occ=r.occ.filter(i=>i!=id));db.complaints=db.complaints.filter(c=>c.sid!=id);
 save();toast('Student deleted');stuRows();
}
function roomCards(){
 const f=$('#rf').value;
 $('#rc').innerHTML=db.rooms.filter(r=>!f||rs(r)==f).map(r=>`<div class="col-sm-6 col-lg-4 col-xl-3"><div class="room ${rs(r).toLowerCase()}">
  <div class="d-flex justify-content-between"><h4 class="mb-0">Room ${r.no}</h4><span class="badge text-bg-${rcol[rs(r)]}">${rs(r)}</span></div>
  <p class="my-2 text-muted"><i class="bi bi-people"></i> ${r.occ.length} of ${r.cap} beds taken</p>
  <button class="btn btn-sm btn-outline-primary" onclick="roomForm('${r.no}')"><i class="bi bi-pencil"></i> Edit</button></div></div>`).join('');
}
function roomForm(no){
 const r=no?db.rooms.find(x=>x.no==no):{no:'',cap:2,maint:false};
 form(no?'Edit room':'Add room',fld('Room number','no',r.no,'text',no?'readonly':'')+fld('Capacity','cap',r.cap,'number','min="1" max="10"')+
  `<div class="form-check"><input class="form-check-input" type="checkbox" name="maint" id="mt2" ${r.maint?'checked':''}><label class="form-check-label" for="mt2">Under maintenance</label></div>`,d=>{
  d.cap=+d.cap;d.maint=!!d.maint;
  if(no){if(d.cap<r.occ.length)return toast('Capacity is lower than current residents');r.cap=d.cap;r.maint=d.maint}
  else if(db.rooms.some(x=>x.no==d.no))return toast('Room number already exists');
  else db.rooms.push({no:d.no,cap:d.cap,occ:[],maint:d.maint});
  save();toast('Room saved');roomCards();
 });
}
function vacate(id){db.rooms.forEach(r=>r.occ=r.occ.filter(i=>i!=id));save();toast('Room vacated');V.alloc()}
function payForm(id){
 const s=db.students.find(x=>x.id==id);
 form('Add payment for '+s.name,`<p>Pending: <b>${inr(s.total-s.paid)}</b></p>`+fld('Amount (₹)','amt','','number',`min="1" max="${s.total-s.paid}"`),d=>{s.paid=Math.min(s.total,s.paid+ +d.amt);save();toast('Payment recorded');V.fee()});
}
function markPaid(id){const s=db.students.find(x=>x.id==id);s.paid=s.total;save();toast('Marked as paid');V.fee()}
function compRows(){
 const f=$('#cs').value;
 const list=(admin?db.complaints:db.complaints.filter(c=>c.sid==S.id)).filter(c=>!f||c.status==f);
 $('#cb').innerHTML=list.map(c=>`<tr><td class="text-nowrap">${c.date}</td><td>${h(sname(c.sid))}</td><td><b>${h(c.title)}</b><br><small class="text-muted">${h(c.desc)}</small></td>
  <td><span class="badge text-bg-${c.status=='Pending'?'warning':'success'}">${c.status}</span></td>
  ${admin?`<td class="text-end"><button class="btn btn-sm btn-outline-primary" onclick="toggleComp(${c.id})">${c.status=='Pending'?'Mark resolved':'Reopen'}</button></td>`:''}</tr>`).join('')||`<tr><td colspan="5" class="text-center text-muted py-4">No complaints to show.</td></tr>`;
}
function toggleComp(id){const c=db.complaints.find(x=>x.id==id);c.status=c.status=='Pending'?'Resolved':'Pending';save();compRows()}

/* Start app */
function startApp(){
 admin=S.role=='admin';menu=mk();
 $('#loginView').classList.add('d-none');$('#appView').classList.remove('d-none');
 $('#who').textContent=admin?'Administrator':me().name;
 $('#nav').innerHTML=menu.map(m=>`<a data-p="${m[0]}"><i class="bi bi-${m[1]}"></i>${m[2]}</a>`).join('');
 $('#nav').onclick=e=>{const a=e.target.closest('a');if(a)go(a.dataset.p)};
 go('dash');
}
$('#mf').onsubmit=e=>{e.preventDefault();mcb(Object.fromEntries(new FormData(e.target)));modal().hide()};
if(S&&db.students.concat([{id:'admin'}]).some(x=>x.id==S.id))startApp();

</script>
</body>
</html>
